server:
  port: 8082
spring:
  application:
    name: ms-andesstay-catalog
    datasource:
    url: ${DB_URL:jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
