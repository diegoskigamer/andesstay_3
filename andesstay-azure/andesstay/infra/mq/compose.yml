name: andesstay-mq

services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: andesstay
      RABBITMQ_DEFAULT_PASS: 12345
      RABBITMQ_ERLANG_COOKIE: andesstay-cluster-cookie-cambiar
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq

volumes:
  rabbitmq1-data: