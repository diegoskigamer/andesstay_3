name: andesstay-apps

services:
  ms-andesstay-bff:
    build: ../../ms-andesstay-bff
    ports:
      - "8080:8080"
    environment:
      ANDESSTAY_SECURITY_ENABLED: ${ANDESSTAY_SECURITY_ENABLED:-false}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-https://login.microsoftonline.com/common/v2.0}
      RESERVATIONS_SERVICE_URL: http://ms-andesstay-reservations:8081
      CATALOG_SERVICE_URL: http://ms-andesstay-catalog:8082
      AUDIT_SERVICE_URL: http://ms-andesstay-audit:8084
      REPORT_SERVICE_URL: http://ms-andesstay-report:8085
    depends_on:
      - ms-andesstay-reservations
      - ms-andesstay-catalog
      - ms-andesstay-audit
      - ms-andesstay-report
    networks:
      - andesstay-apps-net

  ms-andesstay-reservations:
    build: ../../ms-andesstay-reservations
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-andesstay}?currentSchema=reservations
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
      CATALOG_SERVICE_URL: http://ms-andesstay-catalog:8082
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:19092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andesstay-apps-net

  ms-andesstay-catalog:
    build: ../../ms-andesstay-catalog
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-andesstay}?currentSchema=catalog
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
    networks:
      - andesstay-apps-net

  ms-andesstay-notify:
    build: ../../ms-andesstay-notify
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andesstay-apps-net

  ms-andesstay-audit:
    build: ../../ms-andesstay-audit
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-andesstay}?currentSchema=audit
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:19092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andesstay-apps-net

  ms-andesstay-report:
    build: ../../ms-andesstay-report
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-andesstay}?currentSchema=report
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:19092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andesstay-apps-net

  ms-andesstay-rabbitmq-admin:
    build: ../../ms-andesstay-rabbitmq-admin
    ports:
      - "8086:8086"
    environment:
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-http://host.docker.internal:15672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andesstay-apps-net

  ms-andesstay-kafka-admin:
    build: ../../ms-andesstay-kafka-admin
    ports:
      - "8087:8087"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:19092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andesstay-apps-net

networks:
  andesstay-apps-net:
    driver: bridge
