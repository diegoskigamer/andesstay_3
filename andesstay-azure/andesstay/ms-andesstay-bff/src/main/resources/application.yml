server:
  port: 8080

spring:
  application:
    name: ms-andesstay-bff

# Seguridad desactivada por defecto (todo abierto, para desarrollo).
# Para activar el login real con Azure AD, define como variables de entorno:
#   ANDESSTAY_SECURITY_ENABLED=true
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://login.microsoftonline.com/<TENANT_ID>/v2.0
andesstay:
  security:
    enabled: ${ANDESSTAY_SECURITY_ENABLED:false}

services:
  reservations-url: ${RESERVATIONS_SERVICE_URL:http://localhost:8081}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  audit-url: ${AUDIT_SERVICE_URL:http://localhost:8084}
  report-url: ${REPORT_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
